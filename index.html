<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>简单MD加载示例</title>
    <!-- 引入基础样式 -->
    <style>
        body { max-width: 900px; margin: 2rem auto; padding: 0 20px; line-height: 1.6; }
        pre { background: #f5f5f5; padding: 1rem; border-radius: 6px; overflow-x: auto; }
        code { background: #eee; padding: 2px 4px; border-radius: 3px; }
    </style>
    <!-- 引入marked.js解析库 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- 引入DOMPurify做安全过滤 -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
    <!-- 引入highlight.js实现代码高亮 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/core.min.js"></script>
</head>

<body>
    <!-- 渲染结果容器 -->
    <div id="md-render-area"></div>

    <script>
        // 配置marked开启GFM语法支持和代码高亮
        marked.setOptions({
            gfm: true,
            breaks: true,
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    return hljs.highlight(code, { language: lang }).value;
                }
                return hljs.highlightAuto(code).value;
            }
        });
        fetch('README.md')
            .then(res => res.text())
            .then(mdText => {
                const safeHtml = DOMPurify.sanitize(marked.parse(mdText));
                document.getElementById('md-render-area').innerHTML = safeHtml;
            })
    </script>
</body>

</html>
